# 楽天の商品画像とアフィリエイトリンクを週1回取り直し、変更があればプルリクエストを作る。
#
# 必要なリポジトリシークレット（Settings → Secrets and variables → Actions）:
#   RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_AFFILIATE_ID
# 未設定のあいだは何もせずに終了する（警告だけ残す）。
name: 楽天データの更新

on:
  schedule:
    # 毎週月曜 9:00 JST（= 00:00 UTC）
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: シークレットの有無を確認
        id: secrets
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: |
          if [ -z "$RAKUTEN_APP_ID" ]; then
            echo "::warning::RAKUTEN_APP_ID が未設定のため、楽天データの更新をスキップしました。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      - name: 楽天APIから画像とアフィリエイトリンクを取得
        if: steps.secrets.outputs.ready == 'true'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: npm run fetch:rakuten

      - name: 差分があるか確認
        id: diff
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if git diff --quiet -- src/data/rackets.json; then
            echo "変更はありませんでした。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- src/data/rackets.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 取得結果が壊れていないか（6軸スコアや診断が成立するか）をテストで確認してから出す
      - name: テスト
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: プルリクエストを作る
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/rakuten-update-$(date +%Y%m%d)-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/rackets.json
          git commit -m "chore: 楽天の商品画像とアフィリエイトリンクを更新

          scripts/fetch-rakuten.mts の定期実行による自動更新。
          マージ前に差分（画像URLとリンク先）を目視で確認すること。"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: 楽天の商品画像とアフィリエイトリンクを更新（$(date +%Y-%m-%d)）" \
            --body "$(cat <<'BODY'
          楽天市場商品検索APIから取得した、商品画像とアフィリエイトリンクの差分です。
          `scripts/fetch-rakuten.mts` の週次実行（.github/workflows/update-rakuten.yml）で自動生成しました。

          ## マージ前に確認すること

          - 画像URLが、そのラケットの商品画像になっているか（ガット・ケースなど別商品を拾っていないか）
          - リンク先がアフィリエイトURL（`hb.afl.rakuten.co.jp`）のままか

          該当商品が見つからなかった機種は、既存の値を維持しています。

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          BODY
          )"
